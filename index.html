    <!-- PWA Settings for iOS -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; height: 100%; }
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #f8fafc; 
        overscroll-behavior-y: none; 
        height: 100%; 
        overflow: hidden; 
        padding: var(--safe-top) env(safe-area-inset-right) var(--safe-bottom) env(safe-area-inset-left);
      }
      #root { height: 100%; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
      .animate-slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      .neural-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
      .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
      
      button:active { transform: scale(0.96); transition: transform 0.1s; }
      
      /* Horizontal snapping for mobile ribbons */
      .snap-x { scroll-snap-type: x mandatory; }
      .snap-center { scroll-snap-align: center; }
    </style>
